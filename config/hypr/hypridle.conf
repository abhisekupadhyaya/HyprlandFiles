# hf hypridle (hyprlang). Never suspends: hf is a server first.
general {
    lock_cmd = /usr/local/bin/hf-lock            # also runs on `loginctl lock-session`
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /usr/local/bin/hf-panel resume
}

listener {
    timeout = 300                                  # 5 min: dim
    on-timeout = /usr/local/bin/hf-control brightness dim
    on-resume = /usr/local/bin/hf-control brightness restore
}

listener {
    timeout = 600                                  # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 630                                  # 10.5 min: displays off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = /usr/local/bin/hf-panel resume
}
