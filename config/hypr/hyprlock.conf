# hyprlock 0.9.6: hyprlang, never converted to Lua.
source = ~/.local/state/hyprlandfiles/current/hyprlock-colors.conf
general {
    hide_cursor = true
}
background {
    monitor =
    path = ~/.local/state/hyprlandfiles/current/wallpaper.png
    blur_passes = 1
    blur_size = 3
    brightness = 0.35
    color = $background
}
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = $background
    outer_color = $accent
    check_color = $foreground
    fail_color = $accent
    font_color = $foreground
    fade_on_empty = false
    rounding = 10
    font_family = Inter
    placeholder_text = Password to unlock HyprlandFiles
    fail_text = $PAMFAIL
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Inter
    color = $foreground
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = HyprlandFiles · session locked
    font_size = 14
    font_family = Inter
    color = $foreground
    position = 0, 48
    halign = center
    valign = center
}
