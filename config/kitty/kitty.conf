# HyprlandFiles terminal. Palette is cached, loaded before the first frame.
include ~/.local/state/hyprlandfiles/current/kitty.conf
font_family      JetBrains Mono
font_size        11.0
enable_audio_bell no
update_check_interval 0
window_padding_width 10
background_opacity 0.96
confirm_os_window_close -1
cursor_shape beam
