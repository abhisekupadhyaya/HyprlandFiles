name: Source and isolated tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 revision
        with:
          python-version: '${{ matrix.python }}'
      - run: ./scripts/check.sh
      - name: Prepare checksum-locked palette runtime
        if: matrix.python == '3.14'
        run: python3 tools/prepare_dev.py
      - name: Extended palette tests
        if: matrix.python == '3.14'
        run: ./scripts/check.sh
