name: Source and isolated tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned v5 revision
        with:
          python-version: '${{ matrix.python }}'
      - run: ./scripts/check.sh
      - name: Prepare checksum-locked palette runtime
        if: matrix.python == '3.14'
        run: python3 tools/prepare_dev.py
      - name: Extended palette tests
        if: matrix.python == '3.14'
        run: ./scripts/check.sh
